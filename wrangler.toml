name = "rax-super-suite"
compatibility_date = "2026-09-01"
pages_build_output_dir = "./dist"

# KV holds the rolling market history (hourly snapshots used for 7-day baselines).
[[kv_namespaces]]
binding = "CACHE"
id = "e17e5f0373004179bef1230c5606bfe7"

[vars]
# Optional upstream configuration — see README "Configuration".
# Real's public image CDN — enables the Tab 5 asset downloader.
CDN_ALLOWED_HOSTS = "media.realapp.com"
# Real's API itself (web.realapp.com) needs a login + signed per-request tokens, so it can't be called anonymously.
# Only set these for an upstream you are authorised to call — see docs/DATA-SOURCES.md.
# REAL_API_BASE = "https://<authorised-upstream>"
# AUCTIONS_ENDPOINT = "v1/auctions"
