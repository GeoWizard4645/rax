name = "rax-super-suite"
compatibility_date = "2026-09-01"
pages_build_output_dir = "./dist"

# KV holds the rolling market history (hourly snapshots used for 7-day baselines).
[[kv_namespaces]]
binding = "CACHE"
id = "e17e5f0373004179bef1230c5606bfe7"

# Workers AI (Qwen3-30B) powers the in-app assistant (/api/chat). Free tier: 10,000 neurons/day; functions/_lib/budget.ts stops at
# AI_DAILY_NEURONS (default 8,000) so the account never bills. See docs/ASSISTANT.md.
[ai]
binding = "AI"

[vars]
# Optional upstream configuration — see README "Configuration".
# Real's public image CDN — enables the Tab 5 asset downloader.
CDN_ALLOWED_HOSTS = "media.realapp.com"
# Real's API itself (web.realapp.com) needs a login + signed per-request tokens, so it can't be called anonymously.
# Only set these for an upstream you are authorised to call — see docs/DATA-SOURCES.md.
# REAL_API_BASE = "https://<authorised-upstream>"
# AUCTIONS_ENDPOINT = "v1/auctions"

# Latest Kalshi snapshot per sport (pushed from GitHub Actions; Kalshi blocks Cloudflare's IPs). Free tier: 100k row writes/day.
# Created with `wrangler d1 create rax-odds`; schema in migrations/. Also needs the KALSHI_PUSH_SECRET Pages secret.
[[d1_databases]]
binding = "ODDS_DB"
database_name = "rax-odds"
database_id = "582cb5cf-4e32-433f-98e7-153b33439d5a"

# Community market database: opt-in, anonymous captures shared between RAX users (docs/COMMUNITY-MARKET.md). Free tier: 5 GB, 5M row
# reads/day, 100k row writes/day — functions/_lib/marketDb.ts keeps writes under a self-imposed daily budget.
# Created with `wrangler d1 create rax-market`; schema in migrations/market/ (its own dir so `d1 migrations apply` for rax-odds never touches it).
[[d1_databases]]
binding = "MARKET_DB"
database_name = "rax-market"
database_id = "8026e213-9092-4c9a-baeb-63df94d12e6e"
migrations_dir = "migrations/market"
