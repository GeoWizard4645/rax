<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="description" content="RAX — an unofficial analytics and scouting terminal for Real App cards: Rateboard wrapper, overpriced-auction radar, volatility screener, OTD optimizer, portfolio audit and Quads intel." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>RAX — RealApp Super-Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Boot watchdog: if the app's script fails to load/run (stale or poisoned cached file after a deploy) the page would stay blank.
      (function () {
        var KEY = 'rax_recover_at';
        function heal() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 60000) return false;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          var urls = [location.href];
          document.querySelectorAll('script[src], link[rel="stylesheet"][href]').forEach(function (el) { urls.push(el.src || el.href); });
          Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); })).then(function () { location.reload(); });
          return true;
        }
        window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') heal(); }, true);
        setTimeout(function () {
          var r = document.getElementById('root');
          if (!r || r.childElementCount) return;
          if (heal()) return;
          r.innerHTML = '<div style="max-width:30rem;margin:6rem auto;padding:0 1rem;font:14px/1.5 system-ui,sans-serif;color:#cbd5e1"><b style="color:#fff">RAX didn\u2019t load.</b><p>This is usually an out-of-date cached file. <a href="" style="color:#34d399" onclick="location.reload();return false">Reload</a> \u2014 or hard-reload with Cmd/Ctrl+Shift+R.</p></div>';
        }, 10000);
      })();
    </script>
  </body>
</html>
