name: Kalshi odds snapshot

# Kalshi answers Cloudflare's shared egress IPs with HTTP 429, so /api/odds/events can't read it live from the edge.
# This job (a GitHub runner IP, free for a public repo) snapshots Kalshi's public market data every ~10 minutes and
# force-pushes it to the orphan branch `odds-data`; the function falls back to it (read via raw.githubusercontent.com).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Kalshi
        run: |
          npx esbuild scripts/kalshi-snapshot.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/ks.mjs"
          node "$RUNNER_TEMP/ks.mjs" "$RUNNER_TEMP/out"
      - name: Publish to the odds-data branch
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b odds-data
          git config user.name "odds-snapshot[bot]"
          git config user.email "odds-snapshot@users.noreply.github.com"
          mkdir kalshi && mv ./*.json kalshi/
          git add -A
          git commit -q -m "Kalshi snapshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" odds-data
